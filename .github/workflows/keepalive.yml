# Sends one harmless request to the Supabase database every day so the free
# project is never paused for inactivity. Safe to delete if you move to a paid plan.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch: {}     # also lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - name: Check the secrets are set
        run: |
          # Strip stray spaces/newlines that sneak in when a secret is pasted.
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          key="$(printf '%s' "$SUPABASE_KEY" | tr -d '[:space:]')"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::Repository secret SUPABASE_URL and/or SUPABASE_KEY is missing or empty. Add both under Settings > Secrets and variables > Actions > Repository secrets (see README Part C)."
            exit 1
          fi
          case "$url" in
            https://*.supabase.co) ;;
            *) echo "::error::SUPABASE_URL must look like https://<project-ref>.supabase.co (no trailing path)."; exit 1 ;;
          esac
          echo "SB_URL=${url%/}" >> "$GITHUB_ENV"
          echo "SB_KEY=$key" >> "$GITHUB_ENV"
      - name: Call the ping function
        run: |
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST "$SB_URL/rest/v1/rpc/ping" \
            -H "apikey: $SB_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status"
          cat response.txt; echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase ping returned HTTP $status. 404 = ping() function missing (run the schema); 401/403 = wrong key or ping() not granted to anon."
            exit 1
          fi
